name: CI

on:
  push:
    branches: [main]
  pull_request:

# 必要最小限の権限だけを与える
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # アクションはタグではなくコミットSHAで固定する（タグの付け替えによる改ざん対策）
      - name: コードを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js を用意する
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストールする（lockfile どおり、install スクリプトは実行しない）
        run: npm ci --ignore-scripts

      # 利用者に届くパッケージは moderate 以上で止める。開発用ツールは high 以上のみ止め、無関係な PR が落ち続けるのを防ぐ
      - name: 依存関係の既知の脆弱性を確認する（本番）
        run: npm audit --omit=dev --audit-level=moderate

      - name: 依存関係の既知の脆弱性を確認する（開発用を含む）
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build
